services:
  - type: web
    name: evo-insidesales-dashboard
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    envVars:
      - key: HIGHLEVEL_API_KEY
        sync: false
      - key: HIGHLEVEL_LOCATION_ID
        sync: false
